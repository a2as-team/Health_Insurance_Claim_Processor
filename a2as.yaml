    module: services.claim_processor
    args: [self, request_id, processing_time, error]
    params:
      returns: dict
  _create_final_response:
    type: sync
    module: services.claim_processor
    args: [self, request_id, session_state, processing_time]
    params:
      returns: dict
  _format_input_text:
    type: sync
    module: services.claim_processor
    args: [self, request_id, processed_files]
    params:
      returns: str
  _run_workflow:
    type: async
    module: services.claim_processor
    args: [self, request_id, processed_files]
    params:
      returns: Dict
  create_app:
    type: sync
    module: main
    params:
      returns: FastAPI
  create_bill_processing_agent:
    type: sync
    module: agents.HealthInsuranceClaimProcessorAgent.sub_agents.BillProcessingAgent.bill_agent
    params:
      returns: LlmAgent
  create_claim_data_agent:
    type: sync
    module: agents.HealthInsuranceClaimProcessorAgent.sub_agents.ClaimDataAgent.claim_data_agent
    params:
      returns: LlmAgent
  create_claim_decision_agent:
    type: sync
    module: agents.HealthInsuranceClaimProcessorAgent.sub_agents.ClaimDecisionAgent.claim_decision_agent
    params:
      returns: LlmAgent
  create_discharge_processing_agent:
