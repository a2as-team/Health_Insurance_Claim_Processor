  is_running_in_docker:
    type: sync
    module: utils.config
    params:
      returns: bool
  lifespan:
    type: async
    module: main
    args: [app]
  main:
    type: sync
    module: main
  process_claim:
    type: async
    module: services.claim_processor
    args: [self, files]
    params:
      returns: dict
  serve_frontend:
    type: sync
    module: main

variables:
  google_api_key:
    type: env
  OLLAMA_MODEL:
    type: env
    params:
      caller: [os.environ, os.environ.get]
      path: [agents.HealthInsuranceClaimProcessorAgent.sub_agents.DocumentAgent.document_agent, agents.HealthInsuranceClaimProcessorAgent.sub_agents.ClaimDataAgent.claim_data_agent,
        agents.HealthInsuranceClaimProcessorAgent.sub_agents.BillProcessingAgent.bill_agent, agents.HealthInsuranceClaimProcessorAgent.sub_agents.ClaimDecisionAgent.claim_decision_agent,
        agents.HealthInsuranceClaimProcessorAgent.sub_agents.DischargeProcessingAgent.discharge_agent, agents.HealthInsuranceClaimProcessorAgent.sub_agents.ValidationAgent.validation_agent]
  OLLAMA_URL:
    type: env
    params:
      caller: [os.getenv]
      path: [utils.config]

files:
  /.dockerenv:
    type: literal
    actions: [read]
    params:
      caller: [is_running_in_docker]
  index.html:
    type: literal
    actions: [read]
    params:
      caller: [serve_frontend]
      path: [frontend_path]
